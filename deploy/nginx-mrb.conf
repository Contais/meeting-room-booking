# 会议室预约系统 Nginx 配置（生产环境）
# 部署路径: /etc/nginx/sites-available/mrb 或 /etc/nginx/conf.d/mrb.conf
#
# 关键：/ws/ 路径必须配置 WebSocket 升级头，否则连接会失败并返回 200 HTML
# 网关端口: 18080 (生产环境)

server {
    listen 80;
    server_name 106.53.178.198;

    # 前端静态文件
    location / {
        root /app/server/mrb/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---------- API 代理 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ---------- WebSocket 代理（站内信实时推送）----------
    # 必须配置 Upgrade/Connection 头，否则 WebSocket 握手失败
    location /ws/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSocket 长连接超时（秒），保持连接不中断
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
