server:
  port: 8080

spring:
  application:
    name: mrb-gateway
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      config:
        file-extension: yml
        namespace: ${NACOS_NAMESPACE:dev}
      discovery:
        namespace: ${NACOS_NAMESPACE:dev}
    gateway:
      routes:
        - id: uc-service
          uri: lb://mrb-user
          predicates:
            - Path=/api/uc/**
          filters:
            - StripPrefix=2
        - id: auth-service
          uri: lb://mrb-auth
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: meeting-service
          uri: lb://mrb-meeting
          predicates:
            - Path=/api/meeting/**
          filters:
            - StripPrefix=1

# CORS 允许的来源（逗号分隔）
# Chrome 73+ 对同源 POST 请求也会发送 Origin 头，需将生产域名加入白名单，否则网关返回 403
cors:
  allowed-origins: http://localhost:*,http://127.0.0.1:*,https://mrb.mreasonchan.cn
