server:
  port: 8081

spring:
  application:
    name: mrb-user
  datasource:
    url: jdbc:mysql://localhost:3306/mrb_user?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  # 邮件服务（可选）：配置 SMTP 后才会真实发送密码重置验证码；
  # 未配置时验证码会打印到服务日志，便于本地开发/演示。
  # mail:
  #   host: smtp.example.com
  #   port: 465
  #   username: your-account@example.com
  #   password: your-password
  #   properties:
  #     mail:
  #       smtp:
  #         auth: true
  #         ssl:
  #           enable: true

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id
