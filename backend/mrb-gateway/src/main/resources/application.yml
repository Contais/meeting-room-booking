server:
  port: 8080

spring:
  application:
    name: mrb-gateway
  # 允许上传请求体在内存中缓冲到 10MB（默认 256KB 会拒绝大文件上传）
  codec:
    max-in-memory-size: 10MB
  cloud:
    gateway:
      routes:
        - id: uc-service
          uri: lb://mrb-user
          predicates:
            - Path=/api/uc/**
          filters:
            - StripPrefix=2
        - id: auth-service
          uri: lb://mrb-auth
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: meeting-service
          uri: lb://mrb-meeting
          predicates:
            - Path=/api/meeting/**
          filters:
            - StripPrefix=1
        - id: file-service
          uri: lb://mrb-user
          predicates:
            - Path=/api/file/**
          filters:
            - StripPrefix=1
        - id: ws-user-service
          uri: lb:ws://mrb-user
          predicates:
            - Path=/ws/**
