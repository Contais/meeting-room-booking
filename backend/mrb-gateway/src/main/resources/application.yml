server:
  port: 8080

spring:
  application:
    name: mrb-gateway
  # 允许上传请求体在内存中缓冲到 10MB（默认 256KB 会拒绝大文件上传）
  codec:
    max-in-memory-size: 10MB
  cloud:
    gateway:
      routes:
        # 通知域已迁至 mrb-platform，需在 uc-service 之前匹配，单独分流
        - id: uc-notification-service
          uri: lb://mrb-platform
          predicates:
            - Path=/api/uc/user/notification/**
          filters:
            - StripPrefix=2
        - id: uc-service
          uri: lb://mrb-user
          predicates:
            - Path=/api/uc/**
          filters:
            - StripPrefix=2
        - id: auth-service
          uri: lb://mrb-auth
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: meeting-service
          uri: lb://mrb-meeting
          predicates:
            - Path=/api/meeting/**
          filters:
            - StripPrefix=1
        # 文件存储域已迁至 mrb-platform
        - id: file-service
          uri: lb://mrb-platform
          predicates:
            - Path=/api/file/**
          filters:
            - StripPrefix=1
        # 平台基础服务：字典、系统配置
        - id: platform-service
          uri: lb://mrb-platform
          predicates:
            - Path=/api/platform/**
          filters:
            - StripPrefix=1
        # WebSocket 通知推送已迁至 mrb-platform
        - id: ws-platform-service
          uri: lb:ws://mrb-platform
          predicates:
            - Path=/ws/**
