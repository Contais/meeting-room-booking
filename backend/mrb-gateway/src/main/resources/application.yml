server:
  port: 8080

spring:
  application:
    name: mrb-gateway
  data:
    redis:
      host: localhost
      port: 6379
  # 允许上传请求体在内存中缓冲到 10MB（默认 256KB 会拒绝大文件上传）
  codec:
    max-in-memory-size: 10MB
  cloud:
    gateway:
      routes:
        - id: uc-service
          uri: lb://mrb-user
          predicates:
            - Path=/api/uc/**
          filters:
            - StripPrefix=2
        - id: auth-service
          uri: lb://mrb-auth
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: meeting-service
          uri: lb://mrb-meeting
          predicates:
            - Path=/api/meeting/**
          filters:
            - StripPrefix=1
        # 平台基础服务：字典、系统配置、文件存储、消息通知
        - id: platform-service
          uri: lb://mrb-platform
          predicates:
            - Path=/api/platform/**
          filters:
            - StripPrefix=1
        - id: auth-api-docs
          uri: lb://mrb-auth
          predicates:
            - Path=/auth/v3/api-docs
          filters:
            - RewritePath=/auth/v3/api-docs, /v3/api-docs
        - id: user-api-docs
          uri: lb://mrb-user
          predicates:
            - Path=/uc/v3/api-docs
          filters:
            - RewritePath=/uc/v3/api-docs, /v3/api-docs
        - id: meeting-api-docs
          uri: lb://mrb-meeting
          predicates:
            - Path=/meeting/v3/api-docs
          filters:
            - RewritePath=/meeting/v3/api-docs, /v3/api-docs
        - id: platform-api-docs
          uri: lb://mrb-platform
          predicates:
            - Path=/platform/v3/api-docs
          filters:
            - RewritePath=/platform/v3/api-docs, /v3/api-docs
        # WebSocket 通知推送已迁至 mrb-platform
        - id: ws-platform-service
          uri: lb:ws://mrb-platform
          predicates:
            - Path=/ws/**

jwt:
  # 与 mrb-auth-service 保持一致，生产环境请通过 mrb-gateway-prod.yml 覆盖为随机密钥
  secret: mrb-meeting-room-booking-jwt-secret-key-2024

springdoc:
  swagger-ui:
    urls:
      - name: 鉴权服务
        url: /auth/v3/api-docs
      - name: 用户服务
        url: /uc/v3/api-docs
      - name: 会议室服务
        url: /meeting/v3/api-docs
      - name: 平台服务
        url: /platform/v3/api-docs
